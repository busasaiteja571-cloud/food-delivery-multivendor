name: CI-CD Build, Publish, Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-publish:
    name: Build and publish images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./food_delivery_backend
          file: ./food_delivery_backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/food-delivery-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/food-delivery-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./food-delivery-frontend
          file: ./food-delivery-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/food-delivery-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/food-delivery-frontend:latest

  deploy:
    name: Trigger Render and Vercel deploys
    needs: build-publish
    runs-on: ubuntu-latest
    env:
      GHCR_BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/food-delivery-backend:${{ github.sha }}
      GHCR_FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/food-delivery-frontend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render backend deploy (optional)
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          echo "Triggering Render backend deploy..."
          curl -s -X POST https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d '{"clearCache":true}' | jq .

      - name: Trigger Render frontend deploy (optional)
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          echo "Triggering Render frontend deploy..."
          curl -s -X POST https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d '{"clearCache":true}' | jq .

      - name: Deploy frontend to Vercel (optional)
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_ORG_ID && secrets.VERCEL_PROJECT_ID }}
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./food-delivery-frontend

      - name: Done
        run: echo "Deploy steps queued (check Render/Vercel dashboards)."

# Notes:
# - Configure repository secrets: GITHUB_TOKEN is provided automatically.
# - For Render triggers set: RENDER_API_KEY, RENDER_BACKEND_SERVICE_ID, RENDER_FRONTEND_SERVICE_ID.
# - For Vercel deploy set: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# - jq is used in curl output; if jq is not available on runner, it's still fine but output will be raw JSON.
