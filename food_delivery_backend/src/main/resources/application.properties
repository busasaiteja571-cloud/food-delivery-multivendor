spring.application.name=food_delivery_backend

# ===== DATABASE CONNECTION =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
# "update": Hibernate automatically creates and updates your tables inside the database.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate generates \u2014 invaluable for learning/debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== SERVER =====
server.port=8080

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.cors.allowed-origin=${FRONTEND_URL}